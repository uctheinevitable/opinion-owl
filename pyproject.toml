[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opinion_owl"
version = "0.1.0"
description = "Aspect-based sentiment summaries of laptop discussions"
readme = "README.md"
requires-python = ">=3.14"

[tool.setuptools.packages.find]
where = ["src"]